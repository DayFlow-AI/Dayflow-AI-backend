services:
  api:
    image: ghcr.io/dayflow-ai/dayflow-ai:latest
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_SCHEMA: ${DB_SCHEMA}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_SECRET_REFRESH_KEY: ${JWT_SECRET_REFRESH_KEY}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SEC: ${CLIENT_SEC}
      REDIRECT_URI: ${REDIRECT_URI}
      USER_SCOPES: '["email:read", "profile:read", "client_id"]'
      CORS_ORIGINS: '["http://localhost:5173", "http://172.30.88.252:5173"]'
    networks:
      - web

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_REGISTRY_USERNAME: ${GHCR_USER:-}
      WATCHTOWER_REGISTRY_PASSWORD: ${GHCR_TOKEN:-}
    command: --interval 30 --cleanup --stop-timeout 15s
    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    depends_on:
      - app
    networks:
      - web

networks:
  web:
