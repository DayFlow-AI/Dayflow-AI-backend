[project]
name = "dayflow"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "authlib>=1.7.2",
    "black>=26.5.1",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "fastapi-jwt>=0.3.0",
    "httpx>=0.28.1",
    "httpx-retries>=0.6.0",
    "joserfc>=1.7.4",
    "psycopg>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.4",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.ruff]
extend-exclude = ["alembic/versions"]
[tool.ruff.format]
quote-style = "double"
